name: nutribot
version: 1.0.0
description: "Дневник питания: бот считает КБЖУ и ведёт дневник в своей базе или Google-таблице, плюс приложение в Telegram"
author: Dmitry Ioffe
provides_tools:
  - nutrition_log
requires_env:
  - name: NUTRI_STORAGE
    description: "Где хранить дневник: sqlite (своя база рядом с Hermes) или sheets (Google-таблица). Мастер «hermes nutribot setup» настроит сам"
